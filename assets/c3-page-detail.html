<!--
伙伴云界面示意图 · 结构 3/3：详情与自定义页面架构、组件名称

本文件是组件目录，不是整页示例：
1. 每个 <template> 独立，出现顺序不代表页面默认顺序。
2. 只选需求需要的架构和组件，不整段复制。
3. 不含业务示例、示例数据和默认文案；具体字段结构按需读取 c2-table-form.html。
4. 尺寸、颜色和交互外观由 base.css 与 skins/*.css 提供。
-->

<!-- ══════════ 七、记录详情弹窗架构 ══════════ -->
<template data-architecture="记录详情弹窗" data-use="仅在明确要求弹窗详情时">
  <div class="modal-mask"></div>
  <div class="modal">
    <div class="modal-hd">
      <span class="arrows"><svg class="ico"><use href="#i-prev"/></svg><svg class="ico"><use href="#i-next"/></svg></span>
      <span class="doc-title"><!-- 记录标题 --></span>
      <span class="caret"><!-- 展开图标 --></span>
      <div class="bar-icons"><!-- 记录操作组件 --></div>
    </div>
    <div class="modal-bd">
      <div class="modal-main"><!-- 组件：内容卡片 --></div>
      <div class="modal-side">
        <div class="side-tabs"><!-- 组件：动态/评论页签 --></div>
        <div class="feed"><!-- 组件：动态流 --></div>
        <div class="comment-box"><!-- 组件：评论框 --></div>
      </div>
    </div>
  </div>
</template>

<template data-component="内容卡片" data-group="记录详情">
  <div class="widget-card">
    <div class="wc-hd"><!-- 卡片标题 --></div>
    <div class="wc-bd"><!-- 字段或其他已收录组件 --></div>
  </div>
</template>

<template data-component="动态条目" data-group="记录详情">
  <div class="fi">
    <span class="ic"><svg class="ico"><use href="#i-edit"/></svg></span> <!-- 系统变更条目的铅笔图标 -->
    <div class="bd">
      <div class="mt"><!-- 来源与时间 --></div>
      <div class="ct"><!-- 动态内容 --></div>
    </div>
  </div>
</template>

<template data-component="评论框" data-group="记录详情">

    <div class="ipt"><!-- 评论输入区 --></div>
    <div class="ops"><!-- 附件与发送操作 --></div>
  </div>
</template>

<!-- ══════════ 十四、独立自定义详情页架构（2026-08-07 伙伴云真实页面实测） ══════════
结构边界：
1. 自定义详情页默认是一张独立内容画布，不复用产品壳，也不包在记录详情弹窗中。
2. 独立详情页不出现一级顶栏、左侧导航、记录操作栏、弹窗遮罩、弹窗标题栏或底部栏。
3. 页面内容使用 24 栅格：画布上边距 48、左右内缩 96、组件间距 20；双栏可按 8/24＋16/24 组合。
4. 标题卡片、选项字段步骤样式、页签容器都是真实组件；“详情侧栏卡/详情主内容卡/归档页签卡”只是布局角色，不是组件名称。
5. 标题卡片只承载摘要信息，不放按钮；独立自定义详情页本身不设置系统操作栏。
-->
<template data-architecture="独立自定义详情页" data-default-for="详情页" data-source="伙伴云真实自定义详情页">
  <main class="custom-detail-page">
    <div class="item-page-canvas">
      <div class="item-page-grid">
        <!-- 可选组件：标题卡片，占宽 24 -->
        <!-- 可选组件：选项字段-步骤样式，占宽 24 -->
        <!-- 常见布局：页签容器占宽 8＋页签容器占宽 16；这是栅格组合，不是专用侧栏/主卡组件 -->
        <!-- 可选组件：页签容器，占宽 24；页签内可放表格列表、字段、统计、流程等已收录组件 -->
      </div>
    </div>
  </main>
</template>

<template data-component="记录操作栏" data-group="记录详情系统层" data-use="仅在用户明确要求产品壳或记录弹窗时" data-measured="高56；左右内边距16；标题16/500；按钮高32">
  <div class="item-page-toolbar">
    <div class="item-page-nav"><!-- 上一条、下一条 --></div>
    <div class="item-page-record-title"><!-- 记录主标题 --></div>
    <div class="item-page-shortcuts"><!-- 业务快捷按钮 --></div>
    <div class="item-page-system-actions"><!-- 产品原生记录操作 --></div>
  </div>
</template>

<template data-component="标题卡片" data-group="自定义详情页" data-rule="不放按钮；独立详情页不设记录操作栏" data-measured="卡片高180、内边距20、圆角9；标题20/600；副标题14；关键字段标签12、值14">
  <div class="w-card page-header-card span-24">
    <div class="page-header-heading">
      <div class="page-header-title"><!-- 主标题 --></div>
      <div class="page-header-subtitle"><!-- 副标题或编号 --></div>
    </div>
    <div class="page-header-info">
      <div class="page-header-info-item">
        <div class="page-header-info-label"><!-- 关键字段名称 --></div>
        <div class="page-header-info-value"><!-- 关键字段值；字段类型沿用 c2 --></div>
      </div>
      <!-- 共 1～4 个关键字段 -->
    </div>
  </div>
</template>

<template data-component="选项字段-步骤样式" data-group="自定义详情页" data-measured="高40、圆角9；它是选项字段的展示样式，不是独立阶段组件">

    <span class="current"><!-- 当前选项 --></span>
    <span class="following"><!-- 当前值之后的选项 --></span>
  </div>
</template>

<template data-component="详情页24栅格" data-group="自定义详情页" data-measured="24列；列间距20；组件纵向间距20">
  <div class="item-page-grid">
    <div class="span-8"><!-- 已收录组件 --></div>
    <div class="span-16"><!-- 已收录组件 --></div>
    <div class="span-24"><!-- 已收录组件 --></div>
  </div>
</template>
